# DEVELOPMENT stack: Vite dev server (HMR) + tsx watch + Postgres.
#
#   docker compose up --build         -> http://localhost:5173
#
# For the production stack see docker-compose.prod.yaml.
# Do not run both at once — they'd fight over the same host ports.

name: whiteboard-dev

services:
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      # Stop at the `dev` stage: Vite dev server, not the nginx build.
      target: dev
    # Run a real init (tini) as PID 1. The dev command is `npm run dev`, and npm
    # as PID 1 neither reaps zombies nor reliably forwards SIGTERM to Vite — so a
    # long HMR session accumulates defunct child processes and `docker compose
    # down` waits out the full 10s SIGKILL timeout instead of stopping cleanly.
    # tini forwards signals and reaps orphans. (Prod does not need this: it runs
    # `node`/`nginx` directly as PID 1, which handle their own signals — see the
    # backend Dockerfile's PID-1 note.)
    init: true
    container_name: ${FRONTEND_HOST}
    volumes:
      # Bind mounts: edits on the host appear instantly in the container, which
      # is what drives HMR. Config (vite.config.ts / package.json) is NOT
      # mounted, so the image's own copies are used and changing one is a
      # rebuild.
      - ./frontend/src:/app/src
      - ./shared:/shared
      # index.html and public/ are source too, and were missing here.
      # index.html is Vite's build entry (it rewrites the script tags in it), and
      # public/ is served verbatim at the web root. Unmounted, editing either
      # changed nothing in dev until the image was rebuilt — and the failure
      # presents as "my edit had no effect", not as "the container is stale",
      # which is a much worse thing to debug.
      - ./frontend/index.html:/app/index.html
      - ./frontend/public:/app/public
      # Anonymous volume masking the host's node_modules. Without this, a host
      # node_modules (Windows binaries) could shadow the container's Linux ones.
      - /app/node_modules
    environment:
      # Consumed by vite.config.ts as the dev proxy target. "backend" is the
      # compose service name — Compose runs a DNS server on the shared network
      # that resolves service names to container IPs.
      VITE_API_BASE: "http://backend:${BACKEND_PORT}"
      VITE_PUBLIC_SITE_URL: "${PUBLIC_SITE_URL}"
      # File-change events don't cross the Windows/WSL2 boundary reliably, so
      # the watcher polls instead. Costs some CPU; required on Windows.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    depends_on:
      - backend
    develop:
      watch:
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/Dockerfile

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: dev
    # Same reason as frontend: `npm run dev` (tsx watch) as PID 1 does not reap
    # zombies or forward SIGTERM well. tini as PID 1 fixes both in dev.
    init: true
    container_name: ${BACKEND_HOST}
    volumes:
      - ./backend/src:/app/src
      - ./shared:/shared
      - /app/node_modules
    env_file: .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      # Published so the loadtest harness can reach ws://localhost:3000/ws.
      # The production stack deliberately does NOT publish this.
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      database:
        # Waits for the healthcheck to pass, not merely for the container to
        # start. Plain `depends_on` would let the backend race an unready DB.
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./backend/Dockerfile

  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: ${POSTGRES_HOST}
    env_file: .env
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      # NOTE: mounts the PARENT of PGDATA on purpose. Postgres 18 moved PGDATA
      # to /var/lib/postgresql/18/docker (it is no longer /var/lib/postgresql/data).
      # Mounting the parent keeps the versioned directory inside the volume.
      - database-v:/var/lib/postgresql
    command: ["postgres", "-p", "${POSTGRES_PORT}"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -p ${POSTGRES_PORT} -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      # Grace window: failures during it do NOT count toward `retries`, and a
      # SUCCESS still marks the container healthy immediately — so this never
      # slows a fast host, it only protects a slow one. First-time `initdb` on a
      # cold Windows/WSL2 host (or a loaded CI runner) can exceed the old 0s
      # window's 5x5s=25s budget and get marked `unhealthy`, which then fails
      # every `depends_on: condition: service_healthy` above it.
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  database-v:
    name: "database-v"
